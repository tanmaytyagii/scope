name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Package manifests (versions, metadata, licenses)
        run: node scripts/verify-packages.mjs
      - name: Lint GitHub workflows (actionlint)
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: scope
          POSTGRES_PASSWORD: scope
          POSTGRES_DB: scope_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U scope"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SCOPE_TEST_DATABASE_URL: postgres://scope:scope@localhost:5432/scope_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  performance:
    name: Performance (size independence)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Compares timings at 2,000 and 50,000 traces on this runner, never absolute numbers:
      # fails when ingestion or a read slows down as the database grows (scripts/bench-check.mjs).
      - run: npm run bench:check

  build:
    name: Build & package smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package contents (exports, bins, no sources or build state)
        run: node scripts/verify-packages.mjs --packed
      - name: Install scope-ai from the packed packages, run the starter workflow and serve the dashboard
        run: node scripts/smoke-pack.mjs

  e2e:
    name: Dashboard E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w @scope-ai/web
      - run: npx playwright install --with-deps chromium
      - name: Seed real runs, serve them, and test the dashboard (journeys, keyboard, axe)
        run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t scope:ci .
      - name: The image runs the CLI and the server answers health checks
        run: |
          docker run --rm scope:ci --version
          docker run -d --name scope-ci -p 4700:4700 scope:ci ui --host 0.0.0.0 --insecure-no-auth
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:4700/readyz && break; sleep 1; done
          curl -sf http://127.0.0.1:4700/ | grep -q 'id="root"'
          docker rm -f scope-ci
      - name: The production compose deployment serves an application and a dashboard key
        working-directory: deploy
        env:
          SCOPE_IMAGE: scope:ci
          POSTGRES_PASSWORD: ci${{ github.run_id }}
        run: |
          docker compose up -d --no-build --wait --wait-timeout 120
          key() { docker compose exec -T scope scope keys create --project app --scope "$1" --json | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).secret))'; }
          ingest=$(key ingest)
          read=$(key read)
          curl -sf -X POST http://127.0.0.1:4700/v1/traces -H "authorization: Bearer $ingest" \
            -H 'content-type: application/json' \
            -d '{"resourceSpans":[{"resource":{},"scopeSpans":[{"spans":[{"traceId":"5b8efff798038103d269b633813fc60c","spanId":"eee19b7ec3c1b174","name":"check","startTimeUnixNano":"1900000000000000000","endTimeUnixNano":"1900000000100000000"}]}]}]}'
          curl -sf http://127.0.0.1:4700/api/v1/traces -H "authorization: Bearer $read" | grep -q 5b8efff798038103d269b633813fc60c
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4700/api/v1/traces -H "authorization: Bearer $ingest")" = 403
          docker compose exec -T scope scope db status
          # HTTPS through Caddy (its local certificate authority for localhost); metrics stay internal.
          docker compose --profile https up -d --no-build --wait --wait-timeout 120
          curl -skf https://localhost/readyz
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/metrics)" = 404
          docker compose --profile https down -v

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Review new dependencies
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
