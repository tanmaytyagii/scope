name: SCOPE evaluation
description: Run SCOPE workflows, compare them with committed baselines, and fail the job when quality regresses.
author: SCOPE contributors
branding:
  icon: crosshair
  color: blue

inputs:
  workflows:
    description: >
      Workflow files to run, separated by spaces or newlines (globs allowed). Default: the
      workflows listed in scope.yaml.
    required: false
    default: ''
  working-directory:
    description: Directory of the SCOPE project (where scope.yaml is).
    required: false
    default: '.'
  variants:
    description: >
      Which parameters to run: "default" (the workflow's defaults), "all" (defaults and every
      variant), or a comma-separated list of variant names.
    required: false
    default: default
  baseline:
    description: >
      "auto" compares with baselines/<workflow>[.<variant>].json when it exists; "none" disables
      regression gates; any other value is a baseline file path.
    required: false
    default: auto
  fail-on-gates:
    description: Fail the job when a gate with severity "fail" fails. Set to "false" to only report.
    required: false
    default: 'true'
  node-version:
    description: Node.js version used to run SCOPE (22.16 or newer).
    required: false
    default: '24'
  install:
    description: >
      Where SCOPE comes from: "auto" installs scope-ai from npm at this action's version when that
      version is published, and builds this action's source otherwise; "npm" always installs from
      npm; "source" always builds from source.
    required: false
    default: auto
  comment:
    description: >
      Post the report on the pull request as one comment, updated in place on later pushes. Needs
      `permissions: pull-requests: write`; when commenting is not allowed (e.g. pull requests from
      forks) the action warns instead of failing.
    required: false
    default: 'false'
  github-token:
    description: Token used to comment on the pull request.
    required: false
    default: ${{ github.token }}
  upload-artifact:
    description: Upload the SQLite database and JSON report as a workflow artifact.
    required: false
    default: 'true'
  artifact-name:
    description: Name of the uploaded artifact.
    required: false
    default: scope-results

outputs:
  result:
    description: '"passed", "failed" (a gate failed) or "error" (a workflow could not run).'
    value: ${{ steps.run.outputs.result }}
  report:
    description: Path of the combined JSON report, relative to the working directory.
    value: ${{ steps.run.outputs.report }}
  comment:
    description: URL of the pull request comment, when one was posted or updated.
    value: ${{ steps.run.outputs.comment }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ inputs.node-version }}

    # SCOPE is the version of this action (pin the action to a tag or SHA).
    - name: Install SCOPE
      id: install
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      env:
        SCOPE_ACTION_INSTALL: ${{ inputs.install }}
      run: |
        version=$(node -p "require('./packages/scope-ai/package.json').version")
        mode=$SCOPE_ACTION_INSTALL
        if [ "$mode" = auto ]; then
          if npm view "scope-ai@$version" version >/dev/null 2>&1; then mode=npm; else mode=source; fi
        fi
        case $mode in
          npm)
            npm install --prefix "$RUNNER_TEMP/scope" --no-audit --no-fund --loglevel=error "scope-ai@$version"
            echo "cli=$RUNNER_TEMP/scope/node_modules/scope-ai/bin.js" >> "$GITHUB_OUTPUT"
            ;;
          source)
            npm ci --no-audit --no-fund --ignore-scripts --loglevel=error
            npx tsc -b tsconfig.build.json
            echo "cli=$PWD/packages/cli/dist/bin.js" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "::error::install must be auto, npm or source, not \"$SCOPE_ACTION_INSTALL\""
            exit 2
            ;;
        esac
        echo "SCOPE $version ($mode)"

    - name: Run SCOPE
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SCOPE_CLI: ${{ steps.install.outputs.cli }}
        SCOPE_ACTION_WORKFLOWS: ${{ inputs.workflows }}
        SCOPE_ACTION_VARIANTS: ${{ inputs.variants }}
        SCOPE_ACTION_BASELINE: ${{ inputs.baseline }}
        SCOPE_ACTION_FAIL_ON_GATES: ${{ inputs.fail-on-gates }}
        SCOPE_ACTION_COMMENT: ${{ inputs.comment }}
        SCOPE_ACTION_COMMENT_KEY: ${{ inputs.working-directory }}
        SCOPE_ACTION_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: node "${{ github.action_path }}/run.mjs"

    - name: Upload results
      if: always() && inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.working-directory }}/.scope/scope.db
          ${{ inputs.working-directory }}/.scope/action/
        if-no-files-found: ignore
        retention-days: 14
