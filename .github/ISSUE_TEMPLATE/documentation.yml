name: Documentation
description: Something is missing, unclear or wrong in the docs.
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Page or section
      placeholder: docs/guides/workflows.md#variants
  - type: textarea
    id: problem
    attributes:
      label: What is missing or wrong?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
