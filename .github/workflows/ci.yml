name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Package manifests (versions, metadata, licenses)
        run: node scripts/verify-packages.mjs
      - name: Lint GitHub workflows (actionlint)
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: scope
          POSTGRES_PASSWORD: scope
          POSTGRES_DB: scope_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U scope"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SCOPE_TEST_DATABASE_URL: postgres://scope:scope@localhost:5432/scope_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Build & package smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package contents (exports, bins, no sources or build state)
        run: node scripts/verify-packages.mjs --packed
      - name: Install scope-ai from the packed packages, run the starter workflow and serve the dashboard
        run: node scripts/smoke-pack.mjs

  e2e:
    name: Dashboard E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w @scope-ai/web
      - run: npx playwright install --with-deps chromium
      - name: Seed real runs, serve them, and test the dashboard (journeys, keyboard, axe)
        run: npm run test:e2e
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: docker build -t scope:ci .
      - name: The image runs the CLI and the server answers health checks
        run: |
          docker run --rm scope:ci --version
          docker run -d --name scope-ci -p 4700:4700 scope:ci ui --host 0.0.0.0 --insecure-no-auth
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:4700/readyz && break; sleep 1; done
          curl -sf http://127.0.0.1:4700/ | grep -q 'id="root"'
          docker rm -f scope-ci

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Review new dependencies
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
