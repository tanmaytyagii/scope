name: Release

# Pushing a tag vX.Y.Z publishes that version: the npm packages (with provenance), the Docker image
# on GHCR (linux/amd64 and linux/arm64) and a GitHub release with the CHANGELOG section.
# Running the workflow by hand without a tag is a dry run: everything is built and verified,
# nothing is published. Running it by hand (from main) with an existing tag publishes that tag
# again, from its own commit: what is already on npm is skipped, the image is rebuilt only if
# asked, and the GitHub release is created or updated. It never creates or moves a tag.
# See RELEASING.md.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish again (e.g. v0.4.0). Empty for a dry run.
        required: false
        default: ''
      docker:
        description: With a tag, also build and push the Docker image (only if that failed).
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DRY_RUN: ${{ github.event_name != 'push' && inputs.tag == '' }}
  # The tag being released, and the commit every job builds from: the pushed tag, or the tag
  # given to a manual run (only ever an existing tag), or for a dry run the selected branch.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_REF: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: The tag matches the package version
        id: version
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          if [ "$DRY_RUN" = false ]; then
            if ! [[ $RELEASE_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] ||
              ! git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
              echo "::error::$RELEASE_TAG is not an existing release tag (vX.Y.Z). Publishing only ever uses a tag that was pushed."
              exit 1
            fi
            if [ "$RELEASE_TAG" != "v$version" ]; then
              echo "::error::Tag $RELEASE_TAG does not match the package version $version. Run npm run release:version first."
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ $version == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"
          echo "Releasing $version (dry run: $DRY_RUN)"

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            # Before `npm run release:version`, the notes are still under "Unreleased".
            node scripts/release-notes.mjs "$VERSION" > release-notes.md 2>/dev/null ||
              node scripts/release-notes.mjs Unreleased > release-notes.md
          else
            node scripts/release-notes.mjs "$VERSION" > release-notes.md
          fi
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Packages are complete and install into an empty project
        run: |
          node scripts/verify-packages.mjs --packed
          node scripts/smoke-pack.mjs

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 7

  npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # npm provenance and trusted publishing
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build

      # Fail before publishing anything when npm cannot accept the credentials, and say why.
      # The token itself is never printed (and GitHub masks secrets in the log).
      - name: npm credentials
        if: env.DRY_RUN != 'true'
        env:
          # Leave NPM_TOKEN unset once every package trusts this workflow (npm trusted publishing).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            if user=$(npm whoami 2>npm-whoami.log); then
              echo "Publishing as npm user $user."
              exit 0
            fi
            cat npm-whoami.log >&2
            code=$(grep -o 'npm error code [A-Z0-9]*' npm-whoami.log | head -1 | cut -d' ' -f4 || true)
            case "$code" in
              E401 | E403) why="npm rejected it: the token is invalid, expired or revoked. Create a new granular access token and replace the secret (RELEASING.md, One-time setup)." ;;
              *) why="see the log above." ;;
            esac
            echo "::error title=npm whoami failed (${code:-no npm error code})::The NPM_TOKEN secret could not be checked: $why"
            exit 1
          fi
          # Without a token, npm publishes through trusted publishing (OIDC), which can only be
          # set up for packages that already exist: every package's first release needs a token.
          missing=$(node --input-type=module -e "
            import { spawnSync } from 'node:child_process';
            import { publishOrder } from './scripts/lib/workspaces.mjs';
            const missing = publishOrder().filter(
              (w) => spawnSync('npm', ['view', w.name, 'name']).status !== 0,
            );
            console.log(missing.map((w) => w.name).join(', '));
          ")
          if [ -n "$missing" ]; then
            echo "::error title=NPM_TOKEN is not set::The repository has no NPM_TOKEN secret (or it is empty), and these packages are not on npm yet, so trusted publishing cannot publish them: $missing. Add the secret (RELEASING.md, One-time setup) and run the release again."
            exit 1
          fi
          echo "::notice::No NPM_TOKEN: publishing through npm trusted publishing."

      - name: Publish packages (skips versions already on npm)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -o pipefail
          args=()
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          if node scripts/publish.mjs "${args[@]}" 2>&1 | tee npm-publish.log; then exit 0; fi
          # Name npm's error in the run's annotations, with what usually causes it.
          code=$(grep -o 'npm error code [A-Z0-9]*' npm-publish.log | tail -1 | cut -d' ' -f4 || true)
          case "$code" in
            ENEEDAUTH) hint="npm had no credentials: add the NPM_TOKEN repository secret." ;;
            E401) hint="npm rejected the token: it is invalid, expired or revoked. Replace the NPM_TOKEN secret." ;;
            EOTP) hint="npm asked for a one-time password: the token must be a granular access token with 'Bypass two-factor authentication' enabled." ;;
            E403) hint="npm refused the publish: the token's user may not publish this package, or npm requires two-factor authentication (use a granular token with 2FA bypass). The log above has npm's message." ;;
            E404) hint="npm answers 404 when the token may not publish to this name: the token's user must belong to the scope-ai organization, and the granular token needs read and write access to it (and to all packages, for the first release of the unscoped scope-ai)." ;;
            E422) hint="npm rejected the provenance: package.json repository.url must match this repository." ;;
            *) hint="See the log above for npm's message." ;;
          esac
          echo "::error title=npm publish failed (${code:-no npm error code})::$hint Re-run after fixing it: versions already published are skipped (RELEASING.md)."
          exit 1

  docker:
    name: Publish the Docker image
    needs: verify
    # Publishing an existing tag again leaves its image alone unless asked for.
    if: github.event_name == 'push' || inputs.tag == '' || inputs.docker
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.verify.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.verify.outputs.version }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.prerelease == 'false' }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.DRY_RUN != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.DRY_RUN != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: GitHub release
    needs: [verify, npm, docker]
    # After npm, and after the image unless it was left out of a manual run.
    if: >-
      !cancelled() && (github.event_name == 'push' || inputs.tag != '') &&
      needs.npm.result == 'success' &&
      (needs.docker.result == 'success' || needs.docker.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-notes
      - name: Create (or update) the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "SCOPE $VERSION" --notes-file release-notes.md "${flags[@]}"
          else
            # --verify-tag: the release is attached to the existing tag; no tag is ever created.
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "SCOPE $VERSION" --notes-file release-notes.md "${flags[@]}"
          fi
